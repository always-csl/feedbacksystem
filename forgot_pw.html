<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback System - Forgot Password</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header-bar">
        <div class="logo">Feedback System</div>
    </header>


    <!-- Forgot Password -->
    <main class="login-container">

        <!-- Image -->
        <section class="image-section" aria-label="Student working">
            <img src="DESK_GIRL.png" alt="Student working at a desk">
        </section>


        <!-- Form Section -->
        <section class="login-section">
            <div class="login-content">

                <!-- Welcome -->
                <div class="welcome-header">
                    <h1>Forgot Password?</h1>
                    <p>Enter your email to reset your password.</p>
                </div>


                <!-- Card -->
                <div class="card login-card">

                    <form action="index.html" method="get">

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >
                        </div>


                        <!-- Reset Password -->
                        <button type="submit" class="btn btn-login">
                            Send Reset Link
                        </button>


                        <!-- Back to Login -->
                        <div class="forgot-password">
                            <a href="index.html">Back to Login</a>
                        </div>

                    </form>

                </div>

            </div>
        </section>

    </main>


    <!-- Footer -->
    <footer class="footer-bar">
        <p>&copy; 2026 Feedback System &middot; Northcentral Technical College</p>
    </footer>

</body>

</html>
